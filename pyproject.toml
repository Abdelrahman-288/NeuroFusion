[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofusion"
version = "0.1.0"
description = "Research infrastructure for evaluated brain imaging models"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "nibabel>=5.2,<6", "scipy>=1.13,<2", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
specialists = ["pyedflib==0.1.42", "pydicom==3.0.1"]

[project.scripts]
neurofusion = "neurofusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
